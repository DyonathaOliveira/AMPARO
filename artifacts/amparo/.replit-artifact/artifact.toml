kind = "web"
previewPath = "/"
title = "AMPARO — Cuidado e Bem-Estar"
version = "1.0.0"
id = "artifacts/amparo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24591

[services.development]
run = "pnpm --filter @workspace/amparo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/amparo", "run", "build" ]
publicDir = "artifacts/amparo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24591"
BASE_PATH = "/"
