###############################################################
# AMPARO — Docker Compose
# Runs the full stack: PostgreSQL + API + Frontend (Nginx)
#
# Quick start:
#   cp .env.example .env          # configure credentials
#   docker compose up -d          # start all services
#   open http://localhost          # access the app
###############################################################

services:

  # ── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-amparo}
      POSTGRES_USER:     ${POSTGRES_USER:-amparo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amparo_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs init.sql on the FIRST startup only (creates schema + demo users)
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amparo} -d ${POSTGRES_DB:-amparo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Express API Server ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT:           8080
      NODE_ENV:       production
      DATABASE_URL:   postgresql://${POSTGRES_USER:-amparo}:${POSTGRES_PASSWORD:-amparo_secret}@postgres:5432/${POSTGRES_DB:-amparo}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_to_a_long_random_secret}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React Frontend (Nginx) ─────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
